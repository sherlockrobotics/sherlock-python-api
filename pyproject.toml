[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sherlock-api"
version = "0.1.0"
description = "Python client for the Sherlock REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kirill Meisser" }]
keywords = ["sherlock", "robotics", "inspection", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31,<3",
    "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/sherlockrobotics/sherlock-python-api"
Repository = "https://github.com/sherlockrobotics/sherlock-python-api"
Issues = "https://github.com/sherlockrobotics/sherlock-python-api/issues"
Changelog = "https://github.com/sherlockrobotics/sherlock-python-api/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sherlock_api"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# __all__ is grouped by domain with comments, which reads better than alphabetical.
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
